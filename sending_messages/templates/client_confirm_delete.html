{% extends 'base.html' %}

{% block title %} Удаление клиента {{ client.email }} {% endblock %}

{% block content %}

<div class="container mt-5">
        <h1 class="mb-4">Удалить клиента {{ client.email }}</h1>
        <p>Вы уверены, что хотите удалить "{{ client.email }}"?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a href="{% url 'sending_messages:client_list' %}" class="btn btn-secondary">Отмена</a>
        </form>
</div>

{% endblock %}
