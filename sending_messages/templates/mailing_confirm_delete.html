{% extends 'base.html' %}

{% block title %} Удаление рассылки {{ mailing.pk }} {% endblock %}

{% block content %}

<div class="container mt-5">
        <h1 class="mb-4">Удалить рассылку</h1>
        <p>Вы уверены, что хотите удалить рассылку "{{ mailing.pk }}"?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a href="{% url 'sending_messages:mailing_list' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>

{% endblock %}
